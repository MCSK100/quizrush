services:
  - type: web
    name: quizrush-ai
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash,gemini-3.5-flash,gemini-flash-latest
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free,google/gemma-4-31b-it:free,openai/gpt-oss-20b:free
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b,openai/gpt-oss-120b
      - key: NODE_VERSION
        value: 20
