services:
  - type: web
    name: quizrush-ai
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-20b:free,openai/gpt-oss-120b:free,google/gemma-4-31b-it:free
      - key: NODE_VERSION
        value: 20
